<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />

<title>Wallace Archive</title>

<link rel="stylesheet" href="index.css" />

<script async src="https://a.magsrv.com/ad-provider.js"></script>
<script>
window.AdProvider = window.AdProvider || [];
</script>

</head>


<body>

<header class="hero">

<h1 class="hero-title">Wallace Archive</h1>
<p class="hero-sub" id="currentWorkTitle">
Expand • Read • Scroll
</p>


<section class="works-strip-wrap">

<p class="works-strip-label">Works</p>

<nav
class="works-strip"
id="worksNav"
></nav>

</section>


<div class="toolbar">

<button class="smallbtn" id="openFirstTop">
First Page
</button>

<button class="smallbtn" id="openLastWorkTop">
Last Work
</button>

</div>


<div class="meta" id="meta">
Loading…
</div>


<section
class="search-zone"
id="searchSection"
>

<div class="search-label">
SEARCH
</div>

<nav
class="nav"
id="nav"
style="display:none"
></nav>

<div class="search">

<input
id="q"
type="search"
placeholder="Search works, books, chapters…"
autocomplete="off"
/>

<span class="kbd">Enter</span>

<button
class="smallbtn"
id="clear"
type="button"
>
Clear
</button>

</div>

</section>


<div class="top-banner-shell">

<div class="top-banner-bar">

<div
class="top-banner-inner exo-slot"
id="topBannerSlot"
></div>

</div>

</div>

</header>


<div class="layout">


<aside class="rail library-rail">

<div class="library-shell">

<div class="library-title">
Archive
</div>

<div
class="library-nav"
id="libraryNav"
></div>

</div>

</aside>



<main class="center">

<div id="container"></div>

</main>



<aside class="rail">

<div class="rail-stack">

<div class="slot exo-slot" id="leftRailSlot1"></div>
<div class="slot exo-slot" id="leftRailSlot2"></div>
<div class="slot exo-slot" id="leftRailSlot3"></div>

<div class="slot exo-slot" id="rightRailSlot1"></div>
<div class="slot exo-slot" id="rightRailSlot2"></div>
<div class="slot exo-slot" id="rightRailSlot3"></div>

</div>

</aside>


</div>


<div class="floating-cluster">

<button
id="floatingFirstBtn"
class="floating-btn"
>
↑ First
</button>

<button
id="floatingLastBtn"
class="floating-btn"
>
↓ Last
</button>

<button
id="floatingSearchBtn"
class="floating-btn"
>
Search
</button>

</div>


<script defer src="index.js"></script>

</body>
</html>
